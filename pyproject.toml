[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-upstash-redis"
version = "0.1.0"
description = "LangGraph checkpoint saver backed by Upstash Redis (REST API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Haozhe Li" }]
keywords = ["langgraph", "langchain", "checkpoint", "upstash", "redis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph-checkpoint>=2.0.0,<5.0.0",
    "upstash-redis>=1.1.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/Haozhe-Li/langchain-upstash-redis-checkpoint"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# These modules define a `list` method (required by BaseCheckpointSaver), which shadows the
# builtin in return-type annotations; `typing.List` sidesteps that instead of `list[...]`.
"langgraph/checkpoint/upstash_redis/saver.py" = ["UP006", "UP035"]
"langgraph/checkpoint/upstash_redis/aio.py" = ["UP006", "UP035"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
